name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Release new version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not GITHUB_TOKEN: resources it creates never trigger another workflow,
      # so the release tag would reach no deploy and the release pull request
      # would run no CI.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: 'main'
          manifest-file: '.release-manifest.json'
          config-file: '.release-config.json'