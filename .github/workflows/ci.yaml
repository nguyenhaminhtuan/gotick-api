name: CI

on:
  pull_request:
    paths-ignore:
      - 'infra/**'
      - '.vscode/**'
      - '**.md'
  schedule:
    # The vulnerability database moves even when the code does not.
    - cron: '0 2 * * 1'
  # Lets a deploy workflow gate on a fresh run, and allows re-running by hand.
  workflow_call:
  workflow_dispatch:

concurrency:
  # Under workflow_call, github.workflow resolves to the caller's name, so a
  # deploy-driven run never cancels a pull request's own run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - run: go test -race -shuffle=on ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.10.1

  migrations:
    name: Migration lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-squawk

      - run: make migrate-lint

  sqlc:
    name: sqlc drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: '1.30.0'

      - run: sqlc diff

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-redocly

      - run: redocly lint --format=github-actions

  ogen:
    name: ogen drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - uses: ./.github/actions/setup-redocly

      - run: redocly bundle

      - run: go generate ./...

      - name: Fail if the ogen output is out of date
        run: |
          git add --intent-to-add .
          git diff --exit-code

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  changes:
    name: Changed images
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      images: ${{ steps.changed.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: changed
        uses: ./.github/actions/changed-images
        with:
          force: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') }}

  images:
    name: Images
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.images != '[]')) }}
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read
      # build.yaml declares it for pushing and a caller cannot grant less.
      # Unused here: push is false.
      id-token: write
    with:
      images: ${{ needs.changes.outputs.images || '["api","migrate","docs"]' }}
      push: false
