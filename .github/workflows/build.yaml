name: Build images

on:
  workflow_call:
    inputs:
      images:
        description: JSON array of image names, e.g. '["api","migrate"]'.
        type: string
        required: true
      push:
        description: Push to Artifact Registry. Requires environment.
        type: boolean
        default: false
      environment:
        description: >-
          GitHub environment holding the GCP variables. Required when pushing,
          and left empty the build runs without touching Google Cloud at all.
        type: string
        default: ''
      version:
        description: Extra tag published alongside the commit and latest tags.
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      images:
        description: JSON array of image names.
        type: string
        default: '["api","migrate","docs"]'
      push:
        description: Push to Artifact Registry.
        type: boolean
        default: false
      environment:
        type: choice
        options:
          - dev
          - prd
        default: dev
      version:
        description: Extra tag published alongside the commit and latest tags.
        type: string
        default: ''

permissions: {}

jobs:
  build:
    name: ${{ matrix.image }}
    # An empty matrix vector is an error rather than an empty job list.
    if: inputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No environment when only building, so pull requests never wait on a
    # deployment approval.
    environment: ${{ inputs.push && inputs.environment || '' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - if: inputs.push
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
          token_format: access_token

      - if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # A build that never pushes has no registry to name, so it takes a
          # placeholder that stays on the runner.
          images: >-
            ${{ vars.GCP_PROJECT_ID
              && format('{0}-docker.pkg.dev/{1}/containers/{2}', vars.GCP_REGION, vars.GCP_PROJECT_ID, matrix.image)
              || format('local/{0}', matrix.image) }}
          tags: |
            type=sha
            type=raw,value=latest
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cloud Run wants a plain image manifest, not the index buildx
          # produces once provenance is attached.
          provenance: false
          # Scoped per image so three builds do not evict each other.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
