name: Setup Squawk
description: Install the Squawk CLI and put it on PATH, optionally pinning Node first.

inputs:
  version:
    description: Squawk CLI version to install.
    required: false
    default: '2.59.0'
  node-version:
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - id: install
      shell: bash
      run: npm install -g "squawk-cli@$VERSION"
      env:
        VERSION: ${{ inputs.version }}
