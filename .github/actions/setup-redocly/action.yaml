name: Setup Redocly
description: Install the Redocly CLI and put it on PATH, optionally pinning Node first.

inputs:
  version:
    description: Redocly CLI version to install.
    required: false
    default: '2.40.0'
  node-version:
    description: >-
      Node version to install before the CLI. Left empty, the runner image's own
      Node is used, which floats whenever the image is rolled. Set it to pin the
      runtime instead.
    required: false
    default: ''

outputs:
  version:
    description: Redocly CLI version that was installed.
    value: ${{ steps.installed.outputs.version }}
  node-version:
    description: Node version the CLI runs on, whether pinned here or inherited.
    value: ${{ steps.installed.outputs.node-version }}

runs:
  using: composite
  steps:
    - if: inputs.node-version != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - id: install
      shell: bash
      run: npm install --global --no-fund --no-audit "@redocly/cli@${VERSION}"
      env:
        VERSION: ${{ inputs.version }}
