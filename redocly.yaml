# See https://redocly.com/docs/cli/configuration/ for more information.
apis:
  api@v1:
    root: api/openapi.yaml
    output: api/dist/openapi.yaml
plugins:
  - ./api/plugins/authz.js
extends:
  - recommended
rules:
  info-license: off
  no-server-example.com: off
  no-unused-components: error
  authz/x-authz-required: error
  authz/x-authz-permission-used: error
