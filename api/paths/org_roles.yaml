parameters:
  - $ref: ../components/parameters/TenantID.yaml
get:
  tags:
    - Organizer Roles
  operationId: listOrgRoles
  x-authz:
    scope: tenant
    permission: roles:read
  x-ogen-operation-group: Roles
  summary: List roles
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrganizerRoleList.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    default:
      $ref: ../components/responses/Default.yaml
post:
  tags:
    - Organizer Roles
  operationId: createOrgRole
  x-authz:
    scope: tenant
    permission: roles:manage
  x-ogen-operation-group: Roles
  summary: Create a role
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateOrganizerRoleRequest.yaml
  responses:
    '201':
      description: Resource created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrganizerRole.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    default:
      $ref: ../components/responses/Default.yaml
