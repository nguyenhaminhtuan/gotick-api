get:
  tags:
    - Admin Organizer Applications
  operationId: listAdminOrganizerApplications
  x-ogen-operation-group: OrganizerApplications
  summary: List organizer applications
  security:
    - bearerAuth: []
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrganizerApplicationList.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    default:
      $ref: ../components/responses/Default.yaml
