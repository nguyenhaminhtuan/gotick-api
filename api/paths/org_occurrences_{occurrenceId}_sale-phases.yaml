get:
  tags:
    - Organizer Sale Phases
  operationId: listOrgSalePhases
  x-ogen-operation-group: SalePhases
  summary: List sale phases
  parameters:
    - name: occurrenceId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UUID.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SalePhaseList.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
post:
  tags:
    - Organizer Sale Phases
  operationId: createOrgSalePhase
  x-ogen-operation-group: SalePhases
  summary: Create a sale phase
  parameters:
    - name: occurrenceId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UUID.yaml
  responses:
    '201':
      description: Resource created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SalePhase.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
