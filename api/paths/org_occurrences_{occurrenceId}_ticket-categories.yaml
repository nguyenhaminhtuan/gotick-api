get:
  tags:
    - Organizer Ticket Categories
  operationId: listOrgTicketCategories
  x-ogen-operation-group: TicketCategories
  summary: List ticket categories
  parameters:
    - name: occurrenceId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UUID.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TicketCategoryList.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
post:
  tags:
    - Organizer Ticket Categories
  operationId: createOrgTicketCategory
  x-ogen-operation-group: TicketCategories
  summary: Create a ticket category
  parameters:
    - name: occurrenceId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UUID.yaml
  responses:
    '201':
      description: Resource created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TicketCategory.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
