get:
  tags:
    - Public Events
  operationId: listPublicEvents
  x-ogen-operation-group: Events
  summary: List events
  security: []
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
    - name: q
      in: query
      required: false
      schema:
        type: string
    - name: city
      in: query
      required: false
      schema:
        type: string
    - name: category
      in: query
      required: false
      schema:
        type: string
    - name: organizer
      in: query
      required: false
      schema:
        type: string
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PublicEventList.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    default:
      $ref: ../components/responses/Default.yaml
