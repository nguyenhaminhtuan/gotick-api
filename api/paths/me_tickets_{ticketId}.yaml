get:
  tags:
    - My Tickets
  operationId: getMyTicket
  x-ogen-operation-group: Tickets
  summary: Get my ticket
  security:
    - bearerAuth: []
  parameters:
    - name: ticketId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UUID.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MyTicket.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
