parameters:
  - name: organizerId
    in: path
    required: true
    schema:
      $ref: ../components/schemas/UUID.yaml
get:
  tags:
    - Organizer Members
  operationId: listOrgMembers
  x-ogen-operation-group: Members
  summary: List members
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrganizerMemberList.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
post:
  tags:
    - Organizer Members
  operationId: addOrgMember
  x-ogen-operation-group: Members
  summary: Add a member
  description: >-
    Adds an existing gotick account to the organizer, found by the email it
    registered with. Only owners may change the member list.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AddOrganizerMemberRequest.yaml
  responses:
    '201':
      description: Resource created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrganizerMember.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    default:
      $ref: ../components/responses/Default.yaml
