parameters:
  - $ref: ../components/parameters/TenantID.yaml
  - name: roleId
    in: path
    required: true
    schema:
      $ref: ../components/schemas/UUID.yaml
patch:
  tags:
    - Organizer Roles
  operationId: updateOrgRole
  x-authz:
    scope: tenant
    permission: roles:manage
  x-ogen-operation-group: Roles
  summary: Update a role
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateOrganizerRoleRequest.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrganizerRole.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    default:
      $ref: ../components/responses/Default.yaml
delete:
  tags:
    - Organizer Roles
  operationId: deleteOrgRole
  x-authz:
    scope: tenant
    permission: roles:manage
  x-ogen-operation-group: Roles
  summary: Delete a role
  responses:
    '204':
      description: Resource deleted.
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    default:
      $ref: ../components/responses/Default.yaml
