get:
  tags:
    - Public Occurrences
  operationId: listPublicEventOccurrences
  x-ogen-operation-group: Occurrences
  summary: List event occurrences
  security: []
  parameters:
    - name: eventSlug
      in: path
      required: true
      schema:
        $ref: ../components/schemas/Slug.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PublicOccurrenceList.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
