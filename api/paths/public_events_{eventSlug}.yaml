get:
  tags:
    - Public Events
  operationId: getPublicEvent
  x-ogen-operation-group: Events
  summary: Get an event
  security: []
  parameters:
    - name: eventSlug
      in: path
      required: true
      schema:
        $ref: ../components/schemas/Slug.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PublicEventDetail.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
