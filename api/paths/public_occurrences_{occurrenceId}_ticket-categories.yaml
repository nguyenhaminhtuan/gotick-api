get:
  tags:
    - Public Ticket Categories
  operationId: listPublicTicketCategories
  x-ogen-operation-group: TicketCategories
  summary: List ticket categories
  security: []
  parameters:
    - name: occurrenceId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UUID.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PublicTicketCategoryList.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
