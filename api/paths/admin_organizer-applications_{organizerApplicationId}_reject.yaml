post:
  tags:
    - Admin Organizer Applications
  operationId: rejectAdminOrganizerApplication
  x-authz:
    scope: platform
    roles: [admin]
  x-ogen-operation-group: OrganizerApplications
  summary: Reject an organizer application
  parameters:
    - name: organizerApplicationId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UUID.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ReviewOrganizerApplicationRequest.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrganizerApplication.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
