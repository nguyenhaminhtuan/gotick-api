get:
  tags:
    - Public Organizers
  operationId: getPublicOrganizer
  x-ogen-operation-group: Organizers
  summary: Get an organizer
  security: []
  parameters:
    - name: organizerSlug
      in: path
      required: true
      schema:
        $ref: ../components/schemas/Slug.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PublicOrganizer.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
