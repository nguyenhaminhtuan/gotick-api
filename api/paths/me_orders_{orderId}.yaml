get:
  tags:
    - My Orders
  operationId: getMyOrder
  x-ogen-operation-group: Orders
  summary: Get my order
  security:
    - bearerAuth: []
  parameters:
    - name: orderId
      in: path
      required: true
      schema:
        $ref: ../components/schemas/UUID.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MyOrder.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
