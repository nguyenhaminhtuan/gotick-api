get:
  tags:
    - Admin Users
  operationId: listAdminUsers
  x-authz:
    scope: platform
    roles: [admin]
  x-ogen-operation-group: Users
  summary: List users
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
    - name: role
      in: query
      required: false
      description: Narrow the list to a single platform role.
      schema:
        $ref: ../components/schemas/UserRole.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UserList.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    default:
      $ref: ../components/responses/Default.yaml
