get:
  tags:
    - Admin Cities
  operationId: getAdminCity
  x-ogen-operation-group: Cities
  summary: Get a city
  security:
    - adminAuth: []
  parameters:
    - name: cityCode
      in: path
      required: true
      schema:
        $ref: ../components/schemas/Slug.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/City.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
patch:
  tags:
    - Admin Cities
  operationId: updateAdminCity
  x-ogen-operation-group: Cities
  summary: Update a city
  security:
    - adminAuth: []
  parameters:
    - name: cityCode
      in: path
      required: true
      schema:
        $ref: ../components/schemas/Slug.yaml
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/City.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    default:
      $ref: ../components/responses/Default.yaml
