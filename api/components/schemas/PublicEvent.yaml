type: object
properties:
  id:
    $ref: ./UUID.yaml
  slug:
    $ref: ./Slug.yaml
  name:
    type: string
  description:
    type: string
  image:
    type: string
  status:
    $ref: ./EventStatus.yaml
  isFeatured:
    type: boolean
  category:
    $ref: ./PublicCategory.yaml
  cities:
    type: array
    items:
      $ref: ./PublicCity.yaml
  earlierStartTime:
    type: string
    format: date-time
  latestEndTime:
    type: string
    format: date-time
required:
  - id
  - slug
  - name
  - image
  - status
  - isFeatured
  - category
  - cities
